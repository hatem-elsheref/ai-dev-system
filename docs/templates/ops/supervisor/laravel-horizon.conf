[program:laravel-horizon]
process_name=%(program_name)s
directory=/var/www/app.com
command=php /var/www/app.com/artisan horizon
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3600
stopsignal=TERM
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/app.com/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=APP_ENV="production"
